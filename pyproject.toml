[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-scaffold"
version = "0.0.1"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=8.0",
  "pytest-cov>=5",
  "ruff==0.5.7",
  "types-setuptools",
]

[tool.setuptools.packages.find]
where = ["src"]
