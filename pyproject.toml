[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-scaffold"
version = "0.0.1"
description = "A layered, sanity-checked scaffold for formal mathematical proofs"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"

authors = [
  { name = "Mingli Yuan" }
]

dependencies = [
  # Runtime dependencies (keep minimal)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.5.7",
  "mypy>=1.8",
  "types-setuptools",
]

[project.scripts]
skfd = "skfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------
# Pytest
# --------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -ra"
markers = [
  "sanity: quick end-to-end sanity checks",
  "golden: deterministic snapshot tests",
  "adversarial: intentionally bad inputs must fail fast",
  "structural: internal invariants / structure checks",
  "generated: tests generated from tutorial/sanity fixtures",
  "sanity_m01: milestone M0.1 sanity",
  "sanity_m02: M0.2 progress tests (skipped by default until implemented)",
  "step05: M0.2 Step 05 (mp) tests",
  "step06: M0.2 Step 06 (scopes) tests",
  "step07: M0.2 Step 07 (multi-unit linkage) tests",
]

# --------------------------------------------------
# Ruff (lint + style + import sorting)
# --------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["verifier/", "v0-archive/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

# --------------------------------------------------
# Mypy (static typing)
# --------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true

# Gradual typing strategy:
# Allow missing annotations at first, but enforce consistency where annotated.
disallow_untyped_defs = false
disallow_incomplete_defs = false

warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

no_implicit_optional = true
check_untyped_defs = true

files = ["tools", "src", "tests"]

# Avoid noise from external code
exclude = [
  "verifier/",
  "v0-archive/",
]
