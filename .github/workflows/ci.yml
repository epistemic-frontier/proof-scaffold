name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint_test_typecheck:
    name: Python ${{ matrix.python-version }} / lint + typecheck + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select workdir
        run: |
          if [ -n "${SKFD_WORKDIR:-}" ]; then
            WORKDIR="${SKFD_WORKDIR}"
          elif [ -f "proof-scaffold/pyproject.toml" ]; then
            WORKDIR="proof-scaffold"
          elif [ -f "pyproject.toml" ]; then
            WORKDIR="."
          else
            echo "ERROR: cannot find pyproject.toml in repo root or ./proof-scaffold" >&2
            echo "PWD=$(pwd)" >&2
            ls -la >&2
            exit 2
          fi
          echo "WORKDIR=${WORKDIR}" >> "$GITHUB_ENV"
          echo "Selected WORKDIR=${WORKDIR}"
        env:
          SKFD_WORKDIR: ${{ vars.SKFD_WORKDIR }}

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      
      - name: Install project (locked)
        run: uv sync --locked --all-extras --dev
        working-directory: ${{ env.WORKDIR }}

      - name: Ruff check
        run: uv run --frozen ruff check .
        working-directory: ${{ env.WORKDIR }}

      - name: Type check (mypy)
        run: uv run --frozen mypy .
        working-directory: ${{ env.WORKDIR }}

      - name: Run tests (pytest)
        run: uv run --frozen python -m pytest
        working-directory: ${{ env.WORKDIR }}
